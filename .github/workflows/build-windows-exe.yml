name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Validate HTML
        run: python tools/check_html.py

      - name: Build portable Windows app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FCR_Dashboard `
            --add-data "static;static" `
            --add-data "fcr_database.db;." `
            --collect-all uvicorn `
            --collect-all fastapi `
            --collect-all starlette `
            launcher.py

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/FCR_Dashboard/*" -DestinationPath "FCR_Dashboard-Windows.zip" -Force

      - name: Upload Windows EXE bundle
        uses: actions/upload-artifact@v4
        with:
          name: FCR_Dashboard-Windows
          path: FCR_Dashboard-Windows.zip
          if-no-files-found: error
          retention-days: 30
