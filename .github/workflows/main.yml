name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest
      - run: python tools/check_html.py
      - name: Build portable Windows app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name FCR_Dashboard `
            --add-data "static;static" --collect-all uvicorn --collect-all fastapi `
            --collect-all starlette launcher.py
          Compress-Archive -Path "dist/FCR_Dashboard/*" -DestinationPath "FCR_Dashboard-Windows.zip" -Force
      - name: Create GitHub Release and upload
        uses: softprops/action-gh-release@v2
        with:
          files: FCR_Dashboard-Windows.zip
          generate_release_notes: true
